
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-energy-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "pandas",
    "httpx",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools]
packages = []
py-modules = ["main"]
